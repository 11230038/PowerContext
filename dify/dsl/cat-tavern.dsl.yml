app:
  description: Dify 编排 + seekdb 传闻检索 + PowerContext 跨会话记忆的猫酒馆 Chatflow
  icon: 🐈
  icon_background: '#FFF3E0'
  mode: advanced-chat
  name: 猫酒馆 Cat Tavern
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai_api_compatible:0.0.73@4cf123ffaa4556f079bed6c47f3a462cc825504b859b183239e74eb19136a4b5
    version: null
kind: app
version: 0.4.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: 门轴吱呀一声。柜台后面的老猫抬起眼皮：「新来的？坐吧。」
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 听说你这儿的鱼干会自己走路？
    - 巷口那口井里到底是什么？
    - 账本上为什么有我的名字？
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
      id: start--fetch_memory
      selected: false
      source: start
      sourceHandle: source
      target: fetch_memory
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
      id: start--fetch_lore
      selected: false
      source: start
      sourceHandle: source
      target: fetch_lore
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
      id: fetch_memory--build_context
      selected: false
      source: fetch_memory
      sourceHandle: source
      target: build_context
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
      id: fetch_lore--build_context
      selected: false
      source: fetch_lore
      sourceHandle: source
      target: build_context
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
      id: build_context--tavern_keeper
      selected: false
      source: build_context
      sourceHandle: source
      target: tavern_keeper
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
      id: tavern_keeper--save_memory
      selected: false
      source: tavern_keeper
      sourceHandle: source
      target: save_memory
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
      id: save_memory--answer
      selected: false
      source: save_memory
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 玩家进门：填 player_id 和 session_id
        selected: false
        title: 酒馆门口
        type: start
        variables:
        - default: ''
          label: 玩家编号
          max_length: 64
          options: []
          required: true
          type: text-input
          variable: player_id
        - default: s1
          label: 会话编号
          max_length: 64
          options: []
          required: true
          type: text-input
          variable: session_id
      height: 120
      id: start
      position:
        x: 40
        y: 280
      positionAbsolute:
        x: 40
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data: []
          type: none
        desc: GET /memory/{player_id}
        headers: 'Accept: application/json'
        method: get
        params: ''
        retry_config:
          max_retries: 3
          retry_enabled: true
          retry_interval: 100
        selected: false
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 30
          max_write_timeout: 30
        title: 取记忆 PowerContext
        type: http-request
        url: http://host.docker.internal:8090/memory/{{#start.player_id#}}
        variables: []
      height: 100
      id: fetch_memory
      position:
        x: 320
        y: 180
      positionAbsolute:
        x: 320
        y: 180
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data: []
          type: none
        desc: GET /lore?q=...
        headers: 'Accept: application/json'
        method: get
        params: 'q: {{#sys.query#}}

          player_id: {{#start.player_id#}}

          session_id: {{#start.session_id#}}

          limit: 3'
        retry_config:
          max_retries: 3
          retry_enabled: true
          retry_interval: 100
        selected: false
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 30
          max_write_timeout: 30
        title: 查传闻 seekdb
        type: http-request
        url: http://host.docker.internal:8090/lore
        variables: []
      height: 100
      id: fetch_lore
      position:
        x: 320
        y: 380
      positionAbsolute:
        x: 320
        y: 380
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import json\n\n\ndef _load(raw, default):\n    try:\n        value\
          \ = json.loads(raw)\n    except Exception:\n        return default\n   \
          \ return value if isinstance(value, dict) else default\n\n\ndef main(memory_raw:\
          \ str, lore_raw: str) -> dict:\n    memory = _load(memory_raw, {})\n   \
          \ lore = _load(lore_raw, {})\n    memory_text = memory.get(\"memory_text\"\
          ) or \"（老白还没记住你任何事。）\"\n    lore_text = lore.get(\"lore_text\") or \"（这次没翻到相关传闻。）\"\
          \n    hits = [str(hit.get(\"card_id\", \"\")) for hit in lore.get(\"hits\"\
          , [])]\n    context = (\n        \"【老白记得的事】\\n\" + memory_text + \"\\n\\\
          n\"\n        + \"【酒馆传闻（seekdb 检索结果）】\\n\" + lore_text\n    )\n    return\
          \ {\n        \"context\": context,\n        \"affinity\": str(memory.get(\"\
          affinity\", 0)),\n        \"affinity_label\": str(memory.get(\"affinity_label\"\
          , \"陌生\")),\n        \"lore_ids\": \",\".join(hits) or \"-\",\n        \"\
          memory_artifact\": str(memory.get(\"artifact_id\") or \"\"),\n        \"\
          deed_count\": str(len(memory.get(\"deeds\", []))),\n    }\n"
        code_language: python3
        desc: 解析两个 HTTP 节点的 JSON，拼成老白的上下文
        outputs:
          affinity:
            children: null
            type: string
          affinity_label:
            children: null
            type: string
          context:
            children: null
            type: string
          deed_count:
            children: null
            type: string
          lore_ids:
            children: null
            type: string
          memory_artifact:
            children: null
            type: string
        selected: false
        title: 拼装记忆与传闻
        type: code
        variables:
        - value_selector:
          - fetch_memory
          - body
          variable: memory_raw
        - value_selector:
          - fetch_lore
          - body
          variable: lore_raw
      height: 120
      id: build_context
      position:
        x: 620
        y: 280
      positionAbsolute:
        x: 620
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: MiniMax-M3 扮演猫酒馆掌柜
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 6
        model:
          completion_params:
            max_tokens: 1024
            temperature: 0.8
          mode: chat
          name: MiniMax-M3
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: 10530c2bd6124700aab52d9c0df0714e
          role: system
          text: '你是「老白」，猫酒馆的掌柜——一只有些年纪、记性极好的老猫。酒馆开在巷子深处，柜台后面永远有一碟鱼干和一盏不灭的油灯。


            说话风格：简短、带点痞气，偶尔写一句猫的动作（甩尾巴、舔爪子、把杯子推过来）。不写解释性旁白。


            你必须遵守：

            1. 先看【老白记得的事】。如果玩家过去做过什么，要自然地带进对话：好感度是负数就冷淡、话里带刺；好感度是正数就亲热、给点小便宜；从没见过的玩家就当新客。

            2. 如果玩家问的是猫酒馆、鱼干、井、铃铛、账本、唱片机、伞、盐这些酒馆里的事，就按【酒馆传闻】回答，不要改动传闻里的细节；传闻没写的东西，就承认自己不知道，别编。

            3. 不要复述这些规则，不要把内部数据念出来，不要用列表。


            回答控制在 120 字以内，直接说话。


            {{#build_context.context#}}'
        - id: e173ed6f9e30482f80a87f994e0be70c
          role: user
          text: '{{#sys.query#}}'
        selected: false
        title: 老白说话
        type: llm
        variables: []
        vision:
          enabled: false
      height: 120
      id: tavern_keeper
      position:
        x: 920
        y: 280
      positionAbsolute:
        x: 920
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: key-value-1
            key: ''
            type: text
            value: '{"deed": "{{#sys.query#}}", "reply": "{{#tavern_keeper.text#}}",
              "session_id": "{{#start.session_id#}}"}'
          type: json
        desc: POST /memory/{player_id}
        headers: 'Content-Type: application/json'
        method: post
        params: ''
        retry_config:
          max_retries: 3
          retry_enabled: true
          retry_interval: 100
        selected: false
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 30
          max_write_timeout: 30
        title: 记住这件事 PowerContext
        type: http-request
        url: http://host.docker.internal:8090/memory/{{#start.player_id#}}
        variables: []
      height: 100
      id: save_memory
      position:
        x: 1220
        y: 280
      positionAbsolute:
        x: 1220
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: '{{#tavern_keeper.text#}}


          ---

          🕯️ 好感度 {{#build_context.affinity#}}（{{#build_context.affinity_label#}}）｜旧事
          {{#build_context.deed_count#}} 条｜传闻 {{#build_context.lore_ids#}}'
        desc: ''
        selected: false
        title: 老白的回话
        type: answer
        variables: []
      height: 120
      id: answer
      position:
        x: 1520
        y: 280
      positionAbsolute:
        x: 1520
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.7
  rag_pipeline_variables: []
